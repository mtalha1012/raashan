# Render blueprint, one service for API and frontend
services:
  - type: web
    name: raashan
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # MongoDB Atlas connection string
      - key: DB_URI
        sync: false
      # Site URL for reset password emails
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 5d
      - key: COOKIE_EXPIRE
        value: "7"
